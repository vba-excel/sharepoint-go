name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local   # <— aqui

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go (1.25.x)
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true

      - name: Go env
        run: go env

      - name: Download deps
        run: go mod download

      - name: Build (all pkgs)
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.0
          install-mode: go
          args: --timeout=5m
          only-new-issues: false

      - name: Security scan (govulncheck)
        uses: golang/govulncheck-action@v1.0.4
        with:
          go-version-input: "1.25.x"
          go-package: "./..."

      - name: Test
        run: go test -race -count=1 ./...
