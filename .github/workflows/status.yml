name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]   # releases por tag estão noutro workflow
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    env:
      # força usar a toolchain instalada pelo setup-go (evita auto-upgrade)
      GOTOOLCHAIN: local

    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Setup Go (1.25.x)
        uses: actions/setup-go@v6.0.0
        with:
          go-version: "1.25.x"
          cache: true

      - name: Go env
        run: go env

      - name: Download deps
        run: go mod download

      - name: Build (all pkgs)
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          # fixa uma versão v2 estável do golangci-lint
          version: latest
          install-mode: go
          args: --timeout=5m
          only-new-issues: false

      - name: Security scan (govulncheck)
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.25.x"
          go-package: "./..."

      - name: Test
        run: go test -race -count=1 ./...
