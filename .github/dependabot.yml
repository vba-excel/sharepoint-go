version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: "05:00"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: "05:30"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 5
